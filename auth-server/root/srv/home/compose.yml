services:
  home:
    image: ghcr.io/ansg191/anshulg-com:0.5.1@sha256:1ba986e61d84fbd70766fcacc5587f00aa9a3f8ab184634b8803679fbf5e0c34

    ports:
      - "127.0.0.1:4321:4321"

    restart: always
    user: "${COMPOSE_UID}:${COMPOSE_GID}"
    cap_drop:
      - ALL
    read_only: true

    env_file:
      - "/srv/home/home.env"

    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 128M
