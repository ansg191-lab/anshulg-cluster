services:
  home:
    image: ghcr.io/ansg191/anshulg-com:0.5.0@sha256:c85d6ec9926c2775e11646bb3e68951c682b01e70ccc8a7e78ddd1d8956dd3d9

    ports:
      - "127.0.0.1:4321:4321"

    restart: always
    user: "${COMPOSE_UID}:${COMPOSE_GID}"
    cap_drop:
      - ALL
    read_only: true

    env_file:
      - "/srv/home/home.env"

    deploy:
      resources:
        reservations:
          cpus: "0.1"
          memory: 64M
        limits:
          cpus: "0.5"
          memory: 128M
