apiVersion: apps/v1
kind: Deployment
metadata:
  name: tika
  labels:
    app: tika
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tika
  template:
    metadata:
      name: tika
      annotations:
        linkerd.io/inject: enabled
      labels:
        app: tika
    spec:
      containers:
        - name: tika
          image: apache/tika:3.4.0.0-full@sha256:33d96e4c936b4bc716e9ca310a2e8d93f609be55571e9f777ae247e85462306f
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9998
              protocol: TCP
      restartPolicy: Always
